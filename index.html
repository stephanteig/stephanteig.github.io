    <style>
        :root {
            --bg: #040406;
            --surface: #0c0c10;
            --accent: #a78bfa;
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.4);
            --border: rgba(255, 255, 255, 0.08);
            --font-serif: 'Instrument Serif', serif;
            --font-mono: 'JetBrains Mono', monospace;
            --scroll-pct: 0; /* Fallback for Non-Chrome browsers */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; background: var(--bg); }
        body { color: var(--text); font-family: 'Inter', sans-serif; line-height: 1.6; overflow-x: hidden; }

        .grain { position: fixed; inset: 0; opacity: 0.03; pointer-events: none; z-index: 9999; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.8'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
        .glow { position: fixed; width: 60vw; height: 60vh; filter: blur(120px); opacity: 0.15; pointer-events: none; z-index: -1; border-radius: 50%; }

        /* GLASS HEADER */
        header {
            position: fixed; top: 0; width: 100%; height: 80px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 50px; z-index: 1000;
            background: rgba(4, 4, 6, 0.4);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .logo { font-family: var(--font-serif); font-style: italic; font-size: 26px; cursor: pointer; }
        .nav-links { display: flex; gap: 40px; }
        .nav-links a { text-decoration: none; color: white; font-family: var(--font-mono); font-size: 10px; opacity: 0.5; transition: 0.3s; }
        .nav-links a:hover { opacity: 1; color: var(--accent); }

        /* HERO SCROLL ENGINE */
        .hero-scroll-track { height: 200vh; view-timeline-name: --hero-track; }
        .hero-sticky {
            position: sticky; top: 0; height: 100vh;
            display: grid; place-items: center;
            overflow: hidden;
        }
        
        .hero-content {
            grid-area: 1/1; z-index: 1;
            animation: hero-fade linear forwards;
            animation-timeline: --hero-track;
            animation-range: exit 0% exit 80%;
        }

        .featured-card {
            grid-area: 1/1; z-index: 2;
            width: min(85vw, 1100px); aspect-ratio: 16/9;
            background: var(--surface); border-radius: 20px; border: 1px solid var(--border);
            overflow: hidden; box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            transform: translateY(100vh);
            animation: featured-rise linear forwards;
            animation-timeline: --hero-track;
            animation-range: exit 0% exit 100%;
        }

        /* ZEN / FIREFOX FALLBACKS */
        @supports not (animation-timeline: view()) {
            .hero-content {
                opacity: calc(1 - var(--scroll-pct) * 1.5);
                transform: scale(calc(1 - var(--scroll-pct) * 0.3)) translateY(calc(var(--scroll-pct) * -100px));
                filter: blur(calc(var(--scroll-pct) * 20px));
            }
            .featured-card {
                transform: translateY(calc(100vh - var(--scroll-pct) * 100vh));
            }
        }

        .hero-content h1 { font-size: clamp(60px, 15vw, 240px); font-family: var(--font-serif); font-style: italic; line-height: 0.8; margin: 20px 0; }
        .hero-bio { max-width: 500px; color: var(--text-dim); font-size: 17px; margin: 20px auto 0; }
        .featured-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
        .featured-info { position: absolute; bottom: 40px; left: 40px; text-align: left; }

        @keyframes hero-fade { to { opacity: 0; transform: scale(0.7) translateY(-50px); filter: blur(20px); } }
        @keyframes featured-rise { to { transform: translateY(0); } }

        /* Container & Grid */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 40px; position: relative; }
        .section-spacer { padding-bottom: 120px; }
        .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 100px; }
        .stat-item { padding: 40px; text-align: center; border-right: 1px solid var(--border); }
        .stat-item:last-child { border-right: none; }
        .stat-val { font-family: var(--font-serif); font-size: 42px; font-style: italic; color: var(--accent); display: block; }

        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 4px; background: var(--border); border: 1px solid var(--border); }
        .work-card { background: var(--bg); padding: 40px; aspect-ratio: 1/1; display: flex; flex-direction: column; justify-content: flex-end; text-decoration: none; color: inherit; position: relative; overflow: hidden; transition: 0.4s ease; }
        .work-card:hover { background: var(--surface); }
        .work-bg { position: absolute; inset: 0; opacity: 0.1; background-size: cover; background-position: center; transition: 0.8s ease; }
        .work-card:hover .work-bg { opacity: 0.3; transform: scale(1.1); }
        .work-card h3 { font-family: var(--font-serif); font-size: 32px; font-style: italic; position: relative; margin-bottom: 8px; }

        .resume-row { display: grid; grid-template-columns: 1fr 2fr; gap: 60px; padding: 50px 0; border-bottom: 1px solid var(--border); }
        .res-year { font-family: var(--font-mono); color: var(--accent); }
        .res-title { font-family: var(--font-serif); font-size: 32px; font-style: italic; margin-bottom: 12px; }

        .contact-box { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-top: 60px; }
        .contact-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .contact-form input, .contact-form textarea { background: var(--surface); border: 1px solid var(--border); padding: 20px; color: white; border-radius: 8px; font-family: inherit; outline: none; transition: 0.3s; }
        .contact-form input:focus { border-color: var(--accent); }
        .contact-form .full { grid-column: span 2; }
        .btn { display: inline-flex; align-items: center; gap: 12px; background: white; color: black; padding: 16px 32px; border-radius: 100px; font-family: var(--font-mono); font-size: 11px; text-decoration: none; border: none; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: var(--accent); transform: translateY(-3px); }

        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 40px; }
        .lightbox.active { display: flex; }
        .lb-content { width: 100%; max-width: 1000px; aspect-ratio: 16/9; position: relative; }
        .lb-close { position: absolute; top: -50px; right: 0; color: white; cursor: pointer; }

        @media (max-width: 768px) {
            header { padding: 0 20px; height: 60px; } .nav-links { display: none; }
            .stats-grid, .resume-row, .contact-box { grid-template-columns: 1fr; }
            .hero-content h1 { font-size: 70px; }
            .featured-card { aspect-ratio: 4/3; }
        }
    </style>
</head>
<body>

    <div class="grain"></div>
    <div class="glow" style="top: -10%; left: -10%; background: var(--accent);"></div>
    <div class="glow" style="bottom: -10%; right: -10%; background: #ec4899;"></div>

    <header>
        <div class="logo" onclick="window.scrollTo(0,0)">teig</div>
        <nav class="nav-links">
            <a href="#works" id="nav-works">WORKS</a>
            <a href="#resume" id="nav-resume">RESUME</a>
            <a href="#contact" id="nav-contact">CONTACT</a>
            <a href="javascript:void(0)" onclick="toggleLang()" style="opacity: 1;">NO/EN</a>
        </nav>
    </header>

    <div class="hero-scroll-track" id="hero-track">
        <section class="hero-sticky">
            <div class="hero-content">
                <div class="label" id="hero-tag">// PORTFOLIO_2026</div>
                <h1>Stephan<br><em>Teig</em></h1>
                <p class="hero-bio" id="hero-bio"></p>
                <div class="label" style="margin-top: 40px; opacity: 0.3;"><span id="ui-scroll"></span> ↓</div>
            </div>
            <div class="featured-card" id="featured-card"></div>
        </section>
    </div>

    <main class="container">
        <div class="stats-grid" id="stats-grid"></div>
        <section id="works" class="section-spacer">
            <div class="label" style="margin-bottom: 30px;">// SELECTED_WORKS</div>
            <div class="projects-grid" id="projects-grid"></div>
        </section>
        <section id="resume" class="section-spacer">
            <div class="label" style="margin-bottom: 30px;">// EXPERIENCE</div>
            <div id="resume-list"></div>
            <div style="margin-top: 60px;"><a href="#" id="pdf-link" target="_blank" class="btn"><i data-lucide="download"></i><span id="ui-download"></span></a></div>
        </section>
        <section id="contact" class="section-spacer">
            <div class="label" style="margin-bottom: 30px;">// CONTACT_STUDIO</div>
            <h2 class="serif" style="font-size: clamp(40px, 7vw, 90px); line-height: 1.1;" id="ui-studio"></h2>
            <div class="contact-box">
                <div>
                    <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 40px;">
                        <div id="avatar-img" style="width: 80px; height: 80px; border-radius: 50%; background-size: cover; background-position: center 20%; border: 1px solid var(--accent);"></div>
                        <div><div class="serif" style="font-size: 24px;">Stephan Teig</div><div class="label" style="color: var(--text-dim);">Fredrikstad, Norway</div></div>
                    </div>
                    <div class="label" style="color: white; margin-bottom: 10px;">teig.stephan@gmail.com</div>
                    <div class="label" style="color: white;">+47 921 24 207</div>
                </div>
                <form class="contact-form" action="https://formspree.io/f/mwvrraez" method="POST">
                    <input type="text" name="name" id="f-name" required>
                    <input type="email" name="email" placeholder="Email" required>
                    <textarea name="message" id="f-msg" class="full" rows="5" required></textarea>
                    <button type="submit" class="btn" id="ui-send"></button>
                </form>
            </div>
        </section>
    </main>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <div class="lb-content" id="lb-content" onclick="event.stopPropagation()">
            <div class="lb-close" onclick="closeLightbox()"><i data-lucide="x"></i></div>
        </div>
    </div>

    <script>
        function render() {
            const l = CV.lang;
            const ui = CV.ui[l];

            document.getElementById('nav-works').innerText = ui.works;
            document.getElementById('nav-resume').innerText = ui.resume;
            document.getElementById('nav-contact').innerText = ui.contact;
            document.getElementById('hero-bio').innerText = CV.bio[l];
            document.getElementById('ui-scroll').innerText = ui.scroll;
            document.getElementById('ui-studio').innerText = ui.studio;
            document.getElementById('ui-download').innerText = ui.download;
            document.getElementById('ui-send').innerText = ui.send;
            document.getElementById('f-name').placeholder = ui.name;
            document.getElementById('f-msg').placeholder = ui.message;
            document.getElementById('pdf-link').href = CV.cvPdf;
            document.getElementById('avatar-img').style.backgroundImage = `url(${CV.avatar})`;

            const featured = CV.projects[0];
            document.getElementById('featured-card').innerHTML = `
                <img src="${featured.img}" alt="">
                <div class="featured-info">
                    <div class="label" style="color: white; margin-bottom: 10px;">// Featured Project</div>
                    <h2 class="serif" style="font-size: clamp(32px, 5vw, 56px);">${featured.title}</h2>
                    <button class="btn" style="margin-top: 30px;" onclick="openProject('${featured.id}')">${ui.view}</button>
                </div>
            `;

            document.getElementById('stats-grid').innerHTML = CV.stats.map(s => `
                <div class="stat-item">
                    <span class="stat-val">${s.val}</span>
                    <span class="label" style="color: var(--text-dim);">${s.label[l]}</span>
                </div>
            `).join('');

            document.getElementById('projects-grid').innerHTML = CV.projects.map(p => `
                <a href="javascript:void(0)" onclick="openProject('${p.id}')" class="work-card">
                    <div class="work-bg" style="background-image: url('${p.img}')"></div>
                    ${p.badge ? `<span class="badge" style="position:absolute;top:30px;right:30px;border:1px solid var(--accent);padding:4px 8px;border-radius:4px;font-size:9px;color:var(--accent);font-family:var(--font-mono);">${p.badge}</span>` : ''}
                    <div class="label" style="font-size: 10px; margin-bottom: 10px;">${p.cat}</div>
                    <h3>${p.title}</h3>
                    <p style="font-size: 13px; color: var(--text-dim);">${p.desc[l]}</p>
                </a>
            `).join('');

            document.getElementById('resume-list').innerHTML = CV.experience.map(e => `
                <div class="resume-row">
                    <div class="res-year">${e.year}</div>
                    <div><h3 class="res-title">${e.title[l]}</h3><p style="color: var(--text-dim); font-size: 15px;">${e.desc[l]}</p></div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        // --- CROSS-BROWSER SCROLL FALLBACK ---
        function initScrollFallback() {
            if (!CSS.supports('animation-timeline', 'view()')) {
                const track = document.getElementById('hero-track');
                window.addEventListener('scroll', () => {
                    const rect = track.getBoundingClientRect();
                    const trackHeight = track.offsetHeight;
                    const stickyHeight = window.innerHeight;
                    let progress = (Math.abs(rect.top) / (trackHeight - stickyHeight));
                    progress = Math.max(0, Math.min(1, progress));
                    document.documentElement.style.setProperty('--scroll-pct', progress);
                });
            }
        }

        function toggleLang() {
            CV.lang = CV.lang === 'no' ? 'en' : 'no';
            render();
        }

        function openProject(id) {
            const p = CV.projects.find(x => x.id === id);
            if (p.type === 'none') return;
            if (p.type === 'link') { window.open(p.link, '_blank'); return; }
            const lb = document.getElementById('lightbox');
            const target = document.getElementById('lb-content');
            lb.classList.add('active');
            if (p.type === 'drive') {
                target.innerHTML += `<iframe src="https://drive.google.com/file/d/${p.embed}/preview" width="100%" height="100%" allow="autoplay"></iframe>`;
            } else if (p.type === 'youtube') {
                target.innerHTML += `<iframe src="https://www.youtube.com/embed/${p.embed}?autoplay=1" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>`;
            }
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.getElementById('lb-content').innerHTML = '<div class="lb-close" onclick="closeLightbox()"><i data-lucide="x"></i></div>';
            lucide.createIcons();
        }

        render();
        initScrollFallback();
    </script>
</body>
</html>
